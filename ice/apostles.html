<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            background-color: #E8ECED;
            font-family: Arial, sans-serif;
        }

        .box {
            background-image:
                linear-gradient(rgba(0, 20, 60, 0.15), rgba(0, 20, 60, 0.15)), url("images/christus.webp");
            background-size: cover;
            background-position: center;
            border: 8px solid black;
            border-radius: 40px;
            max-width: 700px;
            margin: 20px auto;
            padding: 30px 20px;
            color: white;
        }

        h2 {
            text-align: center;
            font-weight: normal;
            text-shadow: 1px 1px 4px black;
            margin: 0 0 15px;
        }

        .presidency-title {
            font-size: 2rem;
        }

        .quorum-title {
            font-size: 1.75rem;
        }

        .photos img {
            width: 82px;
            height: 82px;
            object-fit: cover;
            object-position: top;
            border-radius: 50%;
            border: 4px solid white;
            transition: border-color 0.3s, transform 0.3s;
        }

        .photos img:hover {
            border-color: gold;
            transform: scale(1.1);
        }

        .photos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .presidency img {
            width: 100px;
            height: 100px;
        }

        .presidency img:nth-child(2) {
            width: 115px;
            height: 115px;
        }

        .quorum {
            max-width: 430px;
            margin: 0 auto;
        }

        .group + .group {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <main class="box">
        <section class="group">
            <h2 class="presidency-title">First Presidency</h2>
            <div class="photos presidency">
                <img src="images/eyring.webp" alt="Portrait of Elder Eyring">
                <img src="images/oaks.webp" alt="Portrait of Elder Oaks">
                <img src="images/christofferson.webp" alt="Portrait of Elder Christofferson">
            </div>
        </section>
        <section class="group">
            <h2 class="quorum-title">Quorum of the Twelve Apostles</h2>
            <div class="photos quorum">
                <img src="images/uchtdorf.webp" alt="Portrait of Elder Uchtdorf">
                <img src="images/bednar.webp" alt="Portrait of Elder Bednar">
                <img src="images/cook.webp" alt="Portrait of Elder Cook">
                <img src="images/anderson.webp" alt="Portrait of Elder Anderson">
                <img src="images/rasband.webp" alt="Portrait of Elder Rasband">
                <img src="images/stevenson.webp" alt="Portrait of Elder Stevenson">
                <img src="images/renlund.webp" alt="Portrait of Elder Renlund">
                <img src="images/gong.webp" alt="Portrait of Elder Gong">
                <img src="images/soares.webp" alt="Portrait of Elder Soares">
                <img src="images/kearon.webp" alt="Portrait of Elder Kearon">
                <img src="images/causse.webp" alt="Portrait of Elder Causse">
                <img src="images/gilbert.webp" alt="Portrait of Elder Gilbert">
            </div>
        </section>
    </main>
</body>
</html>
