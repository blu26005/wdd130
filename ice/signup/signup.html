<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            background-color: rgb(120, 96, 64);
            font-family: Georgia, "Times New Roman", serif;
            padding: 20px;
        }

        #formContainer {
            width: 420px;
            margin: 0 auto;
            border: 10px solid rgb(18, 67, 158);
            border-radius: 30px;
            overflow: hidden;
            background-color: white;
        }

        #feedHeader {
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        #feedHeader img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            padding: 2px 7px;
            font-size: 18px;
            cursor: pointer;
        }

        #headerText {
            position: absolute;
            top: 95px;
            left: 0;
            width: 100%;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 3px black;
        }

        #headerText h1 {
            font-size: 35px;
        }

        #headerText h2 {
            font-size: 30px;
        }

        #formContent {
            background-color: white;
            padding: 20px;
        }

        #formContent h3 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 18px 10px;
            align-items: center;
        }

        #myForm > label {
            font-size: 16px;
        }

        #myForm > input {
            width: 100%;
            height: 22px;
        }

        #myForm > div {
            white-space: nowrap;
        }

        #myForm section {
            grid-column: 1 / 3;
            text-align: center;
        }

        #myForm section label {
            margin-left: 3px;
        }

        #myForm section button {
            padding: 2px 8px;
            cursor: pointer;
        }

        .password-field {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .password-field input {
            flex: 1;
            min-width: 0;
        }

        .password-field button {
            padding: 2px 6px;
            cursor: pointer;
        }

        #scriptureFooter {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background-color: rgb(20, 20, 20);
        }

        #scriptureFooter img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-right: 3px solid white;
        }

        #scriptureFooter img:last-child {
            border-right: none;
        }
    </style>




</head>

<body>
    <div id="formContainer">

        <header id="feedHeader">
            <button type="button" id="closeBtn">X</button>

            <img src="images/jesus_feeds_5000.jpeg" alt="Jesus feeding a crowd">

            <div id="headerText">
                <h1>Daily Feed</h1>
                <h2>Scripture a Day</h2>
            </div>
        </header>

        <main id="formContent">
            <h3>Sign Up for Daily Scripture Feed</h3>

            <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>

            <div class="password-field">
                <input type="password" id="password" name="password" required>
                <button type="button" id="togglePassword">Show</button>
            </div>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
            </form>
        </main>

        <footer id="scriptureFooter">
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </footer>

</div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }
        });
        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
